<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mustak Ahmed Kafy — Frontend Developer">
  <defs>
    <!-- spotlight beam: bright at top, fades down -->
    <linearGradient id="beam" x1="600" y1="0" x2="600" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#a78bfa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <!-- soft pool of light behind the name -->
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8b7cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- accent gradient (slowly drifts left-right) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-200 0; 200 0; -200 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="soften" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <style>
      text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
      .name { fill: #f0f6fc; }
      .tag  { fill: #9198a1; }
      @media (prefers-color-scheme: light) {
        .name { fill: #24292f; }
        .tag  { fill: #57606a; }
        .light { opacity: 0.45; }
      }
    </style>
  </defs>

  <!-- spotlight: cone from above + pool of light, gently breathing -->
  <g class="light">
    <path d="M530 0 L670 0 L900 240 L300 240 Z" fill="url(#beam)" filter="url(#soften)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="600" cy="150" rx="360" ry="120" fill="url(#pool)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- top eyebrow rule + diamonds -->
  <g>
    <line x1="480" y1="86" x2="562" y2="86" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="638" y1="86" x2="720" y2="86" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M600 79 l6 7 -6 7 -6 -7 z" fill="url(#accent)"/>
    <path d="M578 83.5 l3 3.5 -3 3.5 -3 -3.5 z" fill="#8b949e"/>
    <path d="M622 83.5 l3 3.5 -3 3.5 -3 -3.5 z" fill="#8b949e"/>
  </g>

  <!-- name -->
  <text class="name" x="600" y="152" text-anchor="middle"
        font-size="54" font-weight="700" letter-spacing="0.5">Mustak Ahmed Kafy</text>

  <!-- tagline -->
  <text class="tag" x="600" y="192" text-anchor="middle"
        font-size="18" font-weight="500" letter-spacing="2.5">FRONTEND DEVELOPER&#160;&#160;·&#160;&#160;UI/UX ENTHUSIAST</text>

  <!-- animated gradient underline -->
  <line x1="500" y1="222" x2="700" y2="222" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
